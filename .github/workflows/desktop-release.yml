name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.1-beta)'
        required: true
        default: 'v0.1.1-beta'
      release_name:
        description: 'Release Name (e.g. Unsloth Studio v0.1.1-beta)'
        required: false
        default: 'Unsloth Studio v0.1.1-beta'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Prerelease'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon / Intel DMG)
            artifact_pattern: 'studio/src-tauri/target/release/bundle/dmg/*.dmg'
          - os: windows-latest
            label: Windows (x64 Installer)
            artifact_pattern: 'studio/src-tauri/target/release/bundle/nsis/*.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'studio/src-tauri -> target'

      - name: Install dependencies and build frontend
        working-directory: studio/frontend
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run build

      - name: Install Tauri CLI
        run: npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit

      - name: Build Tauri Desktop Bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          npx --prefix studio tauri build --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Tauri Desktop Bundle (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npx --prefix studio tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: warn

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.release_name }}" >> $GITHUB_OUTPUT
            echo "draft=${{ inputs.draft }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Unsloth Studio ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "draft=false" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish / Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          draft: ${{ steps.vars.outputs.draft == 'true' }}
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          files: ${{ matrix.artifact_pattern }}
          generate_release_notes: true
